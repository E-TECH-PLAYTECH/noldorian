[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xadabra"
version = "0.1.3"
description = "Paste-once runner for AI shell blocks with interactive placeholders"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["cli", "shell", "placeholder", "ai", "assistant", "paste", "noldorian", "xadabra"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
xadabra = "xadabra.cli:main"

[project.urls]
Homepage = "https://github.com/librarynth2/xadabra"

[tool.hatch.build.targets.wheel]
packages = ["src/xadabra"]

[tool.hatch.build.targets.sdist]
include = ["src/xadabra", "tests", "README.md"]
