[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noldorian"
version = "0.2.1"
description = "Human-gated local credential vault, operator CLIs, and optional capability-broker client"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["agents", "credentials", "mcp", "security", "secrets", "vault"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
noldorian = "noldorian.cli:main"
noldorian-mcp = "noldorian.mcp:main"
xadabra = "xadabra.cli:main"
xabra = "xabra.cli:main"
abra = "binabra.cli:main"
xalakazam = "xalakazam.cli:main"

[project.urls]
Documentation = "https://pypi.org/project/noldorian/"
Homepage = "https://pypi.org/project/noldorian/"

[tool.hatch.build.targets.wheel]
packages = ["src/noldorian"]

[tool.hatch.build.targets.wheel.force-include]
"xadabra/src/xadabra" = "xadabra"
"xabra/src/xabra" = "xabra"
"binabra/src/binabra" = "binabra"
"xalakazam/src/xalakazam" = "xalakazam"

[tool.hatch.build.targets.sdist]
include = [
  "/src/noldorian",
  "/xadabra/src/xadabra",
  "/xabra/src/xabra",
  "/binabra/src/binabra",
  "/xalakazam/src/xalakazam",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/SECURE_CAPABILITY_BROKER.md",
  "/CONTRIBUTING.md",
]
