[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noldorian"
version = "0.2.0"
description = "Agent-safe discovery and policy-bound use of local credential capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["agents", "credentials", "mcp", "security", "secrets", "unix-socket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
noldorian = "noldorian.cli:main"
noldorian-mcp = "noldorian.mcp:main"
keyabra = "keyabra.cli:main"
xadabra = "xadabra.cli:main"
xabra = "xabra.cli:main"
abra = "binabra.cli:main"
xalakazam = "xalakazam.cli:main"

[project.urls]
Documentation = "https://github.com/E-TECH-PLAYTECH/noldorian#readme"
Issues = "https://github.com/E-TECH-PLAYTECH/noldorian/issues"
Repository = "https://github.com/E-TECH-PLAYTECH/noldorian"

[tool.hatch.build.targets.wheel]
packages = ["src/noldorian"]

[tool.hatch.build.targets.wheel.force-include]
"keyabra/src/keyabra" = "keyabra"
"xadabra/src/xadabra" = "xadabra"
"xabra/src/xabra" = "xabra"
"binabra/src/binabra" = "binabra"
"xalakazam/src/xalakazam" = "xalakazam"
"keyabra/scripts/install_broker_macos.sh" = "noldorian/install_broker_macos.sh"

[tool.hatch.build.targets.sdist]
include = [
  "/src/noldorian",
  "/keyabra/src/keyabra",
  "/keyabra/scripts/install_broker_macos.sh",
  "/xadabra/src/xadabra",
  "/xabra/src/xabra",
  "/binabra/src/binabra",
  "/xalakazam/src/xalakazam",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/SECURE_CAPABILITY_BROKER.md",
  "/CONTRIBUTING.md",
]
