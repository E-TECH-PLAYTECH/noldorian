name: clipabra
options:
  bundleIdPrefix: net.llmtech
  deploymentTarget:
    macOS: "14.0"
targets:
  clipabra:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.llmtech.clipabra
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        # Menu-bar app: no Dock icon, no app switcher entry.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Everplay-Tech"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
