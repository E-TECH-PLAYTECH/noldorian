[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xabra"
version = "0.3.1"
description = "Install, update, and open Everplay-Tech direct-distribution apps (the ones that don't come from the App Store)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["installer", "dmg", "notarized", "macos", "updater", "cli", "xabra", "noldorian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]
dependencies = []

[project.scripts]
xabra = "xabra.cli:main"

[project.urls]
Homepage = "https://github.com/E-TECH-PLAYTECH/noldorian"

[tool.hatch.build.targets.wheel]
packages = ["src/xabra"]

[tool.hatch.build.targets.sdist]
include = ["src/xabra", "README.md"]
