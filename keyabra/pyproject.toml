[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyabra"
version = "0.2.10"
description = "Securely prompt for API tokens and run CLI commands — no notepad copy-paste dance"
readme = "README.md"
requires-python = ">=3.8"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["token", "secret", "pypi", "twine", "credentials", "cli", "keyabra", "noldorian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
keyabra = "keyabra.cli:main"

[project.urls]
Homepage = "https://github.com/librarynth2/keyabra"

[tool.hatch.build.targets.wheel]
packages = ["src/keyabra"]

[tool.hatch.build.targets.sdist]
include = ["src/keyabra", "README.md"]
