[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyabra"
version = "0.3.0"
description = "Human-gated secret intake and agent-safe credential capability brokering"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["token", "secret", "pypi", "twine", "credentials", "cli", "keyabra", "noldorian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
keyabra = "keyabra.cli:main"

[project.urls]
Homepage = "https://github.com/E-TECH-PLAYTECH/noldorian"

[tool.hatch.build.targets.wheel]
packages = ["src/keyabra"]

[tool.hatch.build.targets.sdist]
include = ["src/keyabra", "README.md"]
