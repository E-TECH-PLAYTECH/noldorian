name: release

# GitHub is not the Noldorian factory. A GitHub Release must not upload to PyPI.
# Factory: local `python3 -m build` → Google Drive packet → twine (project token) →
# customers `pipx install noldorian` / `pip install noldorian` from PyPI.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  refuse-github-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub must not publish noldorian
        run: |
          echo "Noldorian does not publish from GitHub."
          echo "Factory is Drive then twine. Install is pip/pipx from PyPI."
          exit 1
