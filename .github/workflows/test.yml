name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and release tooling
        run: python -m pip install --upgrade build pytest twine
      - name: Test public package
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/xabra/src:${{ github.workspace }}/xadabra/src:${{ github.workspace }}/binabra/src:${{ github.workspace }}/xalakazam/src
        run: python -m unittest discover -s tests -v
      - name: Test Xadabra
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/xadabra/src:${{ github.workspace }}/xabra/src
        run: python -m unittest discover -s xadabra/tests -v
      - name: Test Xalakazam
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/xalakazam/src:${{ github.workspace }}/xabra/src
        run: python -m unittest discover -s xalakazam/tests -v
      - name: Build and inspect metadata
        run: |
          python -m build
          python -m twine check dist/*
