[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xalakazam"
version = "0.1.3"
description = "The Everplay orienter — callable memory for deploying and strategically using Noldorian and the snx spellbook"
readme = "README.md"
requires-python = ">=3.8"
license = "LicenseRef-Proprietary"
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["noldorian", "spells", "snx", "orienter", "deploy", "xalakazam"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
xalakazam = "xalakazam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xalakazam"]

[tool.hatch.build.targets.sdist]
include = ["src/xalakazam", "README.md"]
