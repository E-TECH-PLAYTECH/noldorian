[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xalakazam"
version = "0.1.5"
description = "Noldorian orienter — callable memory for installing and using the public package"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Everplay-Tech LLC" }]
keywords = ["noldorian", "spells", "snx", "orienter", "deploy", "xalakazam"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
xalakazam = "xalakazam.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/noldorian/"

[tool.hatch.build.targets.wheel]
packages = ["src/xalakazam"]

[tool.hatch.build.targets.sdist]
include = ["src/xalakazam", "README.md"]
